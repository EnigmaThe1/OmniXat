name: Commercial platform checks
on:
  push:
    branches: [commercial/compliance-foundation-20261105]
  pull_request:
    paths: [commercial/**, prototype/**, .github/workflows/commercial.yml]
permissions:
  contents: read
concurrency:
  group: commercial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnixat_test
          POSTGRES_PASSWORD: fictional_ci_database_only
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U omnixat_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OMNIXAT_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 user=omnixat_test password=fictional_ci_database_only dbname=postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure bounded Ubuntu archive access for browser dependencies
        timeout-minutes: 2
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo tee /etc/apt/apt.conf.d/99-omnixat-ci-network >/dev/null <<'APT'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          APT::Update::Error-Mode "any";
          APT
      - name: Install pinned test dependencies and Chromium
        timeout-minutes: 8
        run: |
          python -m pip install -r commercial/requirements-web-tests.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends clamav-daemon
          dpkg-query -W clamav-daemon
          /usr/sbin/clamd --version
      - name: Core, identity and PostgreSQL services
        working-directory: commercial
        run: |
          python -m unittest discover -s tests -q
          python -m unittest discover -s identity_tests -q
          python -m unittest discover -s integration_tests -v
      - name: Real Keycloak customer identity qualification
        working-directory: commercial
        env:
          PYTHONPATH: .:integration_tests
          OMNIXAT_KEYCLOAK_HOME: ${{ runner.temp }}/omnixat-keycloak-qualification
          OMNIXAT_OAUTH2_PROXY_BINARY: ${{ runner.temp }}/omnixat-oauth2-proxy
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash qualification/install_keycloak.sh "$OMNIXAT_KEYCLOAK_HOME"
          python -m unittest discover -s provider_tests -v
          python -m unittest discover -s provider_browser_tests -v
          bash qualification/install_oauth2_proxy.sh "$OMNIXAT_OAUTH2_PROXY_BINARY"
          python -m unittest discover -s gateway_browser_tests -v
      - name: Real ClamAV worker and customer scan status
        working-directory: commercial
        env:
          PYTHONPATH: .:integration_tests
          OMNIXAT_CLAMD_BINARY: /usr/sbin/clamd
        run: python -m unittest discover -s scanner_tests -v
      - name: Customer website in real Chromium
        working-directory: commercial
        env:
          PYTHONPATH: .:integration_tests
          OMNIXAT_BROWSER_ARTIFACTS: ${{ runner.temp }}/omnixat-customer-browser
        run: python -m unittest discover -s browser_tests -v
      - name: Preserve fictional website screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-website-screenshots
          path: ${{ runner.temp }}/omnixat-customer-browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Build customer container
        run: docker build --pull -f commercial/Dockerfile.web -t omnixat-customer-check commercial
      - name: Existing fictional-demo suite including browser approval
        if: always()
        working-directory: prototype
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
          environment = dict(os.environ, OMNIXAT_CHROMIUM_PATH=executable)
          raise SystemExit(subprocess.call(
              [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
              env=environment,
          ))
          PYTHON
