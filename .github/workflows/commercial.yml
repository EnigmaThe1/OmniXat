name: Commercial platform checks
on:
  push:
    branches: [commercial/compliance-foundation-20261105]
  pull_request:
    paths: [commercial/**, prototype/**, .github/workflows/commercial.yml]
permissions:
  contents: read
concurrency:
  group: commercial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnixat_test
          POSTGRES_PASSWORD: fictional_ci_database_only
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U omnixat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OMNIXAT_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 user=omnixat_test password=fictional_ci_database_only dbname=postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies and Chromium
        run: |
          python -m pip install -r commercial/requirements-web-tests.txt
          python -m playwright install --with-deps chromium
      - name: Core, identity and PostgreSQL services
        working-directory: commercial
        run: |
          python -m unittest discover -s tests -q
          python -m unittest discover -s identity_tests -q
          python -m unittest discover -s integration_tests -v
      - name: Customer website in real Chromium
        working-directory: commercial
        env:
          PYTHONPATH: .:integration_tests
        run: python -m unittest discover -s browser_tests -v
      - name: Build customer container
        run: docker build --pull -f commercial/Dockerfile.web -t omnixat-customer-check commercial
      - name: Existing fictional-demo suite including browser approval
        if: always()
        working-directory: prototype
        run: python -m unittest discover -s tests -v
