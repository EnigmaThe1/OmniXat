# Operator template for OAuth2 Proxy 7.15.x. Never commit actual secrets.
# Supply client_id, oidc_issuer_url, redirect_url, upstreams and email_domains
# for the qualified environment. Keep the app private behind this gateway.
provider = "oidc"
code_challenge_method = "S256"
scope = "openid profile email records:read records:write"
# Opt-in evidence intake additionally requires approved evidence:read and
# evidence:register access-token scopes. Qualify the provider/client before adding
# them; configure the app's private spool and constrained database grants separately.
insecure_oidc_skip_nonce = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_allow_unverified_email = false
client_secret_file = "/run/secrets/oidc-client-secret"
cookie_secret_file = "/run/secrets/browser-cookie-secret"
cookie_name = "__Host-omnixat-customer"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "1h"
cookie_refresh = "5m"
pass_access_token = true
# Authorization forwarding sends the ID token, which this API must reject.
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
skip_auth_strip_headers = true
pass_host_header = true
skip_provider_button = true
api_routes = ["^/v1/"]
force_json_errors = true
# Authentication applies to every app and API request; only these assets are public.
skip_auth_routes = ["GET=^/$", "GET=^/assets/(app\\.js|site\\.css)$"]
request_logging = false
