name: omnixat
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omnixat
      POSTGRES_USER: omnixat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnixat -d omnixat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [private]
  api:
    build: ./apps/api
    environment:
      OMNIXAT_DATABASE_URL: postgresql+psycopg://omnixat:${POSTGRES_PASSWORD}@db:5432/omnixat
      OMNIXAT_OWNER_PASSWORD: ${OMNIXAT_OWNER_PASSWORD:?Set OMNIXAT_OWNER_PASSWORD in .env}
      OMNIXAT_SESSION_SECRET: ${OMNIXAT_SESSION_SECRET:?Set OMNIXAT_SESSION_SECRET in .env}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      OMNIXAT_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
    networks: [private]
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${OMNIXAT_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]
volumes:
  db_data:
networks:
  private:
    internal: false
